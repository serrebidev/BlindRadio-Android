[package]
name = "blindradio-android"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The desktop repo is the engine's home; its main branch is what ships.
blindradio-core = { git = "https://git.serrebiradio.com/serrebi/blindradio", branch = "main" }
ndk-context = "*"
serde_json = "*"
parking_lot = "*"
crossbeam-channel = "*"
tokio = { version = "*", features = ["rt"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# ponytail: parking_lot_core 0.10 tries futex_time64 first on 32-bit; Android 10's seccomp
# kills the app (SIGSYS) instead of returning ENOSYS. Copy with that path off for 32-bit
# Android. Drop when upstream skips time64 on Android (or the owner's TVs leave Android 10).
[patch.crates-io]
parking_lot_core = { path = "patches/parking_lot_core" }
