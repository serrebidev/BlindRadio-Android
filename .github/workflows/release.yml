name: Release

# Builds, gates and signs the APK on a GitHub runner, then publishes it on Forgejo.
# Commit the version (app/build.gradle.kts) and its CHANGELOG.md section on main first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 0.3.4. app/build.gradle.kts and CHANGELOG.md must already say it.
        required: true
        type: string
      dry_run:
        description: Build and sign only, publish nothing.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
      NDK: 27.3.13750724
    steps:
      - uses: actions/checkout@v5

      - name: Version is committed
        run: |
          grep -q "versionName = \"$VERSION\"" app/build.gradle.kts || { echo "app/build.gradle.kts is not $VERSION"; exit 1; }
          grep -qx "## $VERSION" CHANGELOG.md || { echo "CHANGELOG.md has no ## $VERSION"; exit 1; }

      - name: Tag is free
        if: ${{ !inputs.dry_run }}
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $FORGEJO_TOKEN" \
            "https://git.serrebiradio.com/api/v1/repos/serrebi/BlindRadio-Android/tags/v$VERSION")
          [ "$code" = 404 ] || { echo "Tag v$VERSION exists (HTTP $code)"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # cpal links ALSA for the host build that runs the native tests.
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libasound2-dev pkg-config

      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      # Release is signed with the owner's debug key, as every earlier release: another key
      # cannot update installed copies. Its password is the default, android.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          key="$RUNNER_TEMP/debug.keystore"
          echo "$KEYSTORE" | base64 -d > "$key"
          keytool -list -v -keystore "$key" -storepass android -alias androiddebugkey | grep 'E6:86:D1:94' > /dev/null || { echo "secret is not the owner's key"; exit 1; }
          echo "BLINDRADIO_KEYSTORE=$key" >> "$GITHUB_ENV"

      - name: Native gate
        working-directory: native
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew --no-daemon lintDebug assembleRelease

      - name: Package
        run: |
          mkdir dist
          apk="BlindRadio-Android-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          # Several build-tools versions are installed: take the newest apksigner.
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert=$("$signer" verify --print-certs "dist/$apk" | awk '/SHA-256 digest/ && !f {print; f=1}')
          echo "$cert"
          case "$cert" in *e686d194*) ;; *) echo "APK not signed with the owner's key"; exit 1 ;; esac
          (cd dist && sha256sum "$apk" > "$apk.sha256")
          awk -v v="## $VERSION" '$0 == v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > dist/notes.md
          grep -q '[^[:space:]]' dist/notes.md || { echo "CHANGELOG.md ## $VERSION is empty"; exit 1; }
          cat dist/notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: BlindRadio-Android-v${{ inputs.version }}
          path: dist/

      - name: Publish on Forgejo
        if: ${{ !inputs.dry_run }}
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        # Same order as desktop BlindRadio's publish: tag by git push, draft, files, check, then
        # public. The release never shows without its APK, which the in-app updater needs.
        run: |
          set -euo pipefail
          tag="v$VERSION"
          apk="BlindRadio-Android-$tag.apk"
          git remote set-url origin "https://x-access-token:$FORGEJO_TOKEN@git.serrebiradio.com/serrebi/BlindRadio-Android.git"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          api=https://git.serrebiradio.com/api/v1/repos/serrebi/BlindRadio-Android
          h="Authorization: token $FORGEJO_TOKEN"
          # Right after the tag push the create can fail once: retry it.
          id="$(jq -n --arg t "$tag" --rawfile n dist/notes.md '{tag_name: $t, name: $t, body: $n, draft: true}' |
            curl -sSf --retry 3 --retry-all-errors --retry-delay 5 -H "$h" -H 'Content-Type: application/json' -d @- "$api/releases" | jq -r .id)"
          for f in "$apk" "$apk.sha256"; do
            curl -sSf -o /dev/null --retry 3 --retry-all-errors --retry-delay 5 -H "$h" -F "attachment=@dist/$f" "$api/releases/$id/assets?name=$f"
          done
          present="$(curl -sSf -H "$h" "$api/releases/$id" | jq -r '.assets[].name')"
          echo "$present"
          [ "$(grep -c . <<<"$present")" = 2 ] || { echo "release must hold exactly the APK and its .sha256"; exit 1; }
          for f in "$apk" "$apk.sha256"; do
            grep -qx "$f" <<<"$present" || { echo "missing: $f"; exit 1; }
          done
          curl -sSf -o /dev/null -X PATCH -H "$h" -H 'Content-Type: application/json' \
            -d '{"draft": false, "prerelease": false}' "$api/releases/$id"
          test "$(curl -sSf "$api/releases/latest" | jq -r .tag_name)" = "$tag"
          # The in-app updater checks the published APK against its .sha256.
          curl -sSfL -o "$RUNNER_TEMP/$apk" "https://git.serrebiradio.com/serrebi/BlindRadio-Android/releases/download/$tag/$apk"
          curl -sSfL "https://git.serrebiradio.com/serrebi/BlindRadio-Android/releases/download/$tag/$apk.sha256" |
            (cd "$RUNNER_TEMP" && sha256sum -c)
